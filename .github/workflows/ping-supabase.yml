name: Ping Supabase

on:
  schedule:
    # Runs twice a week (Mon & Thu at 08:00 UTC)
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Lets you run the script manually via GitHub web ui

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-Alive Supabase Postgres
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json")
          
          echo "Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to ping Supabase! Status: $HTTP_STATUS"
            exit 1
          fi
