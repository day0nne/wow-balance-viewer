name: Ping Supabase

on:
  schedule:
    # Runs twice a week (Mon & Thu at 08:00 UTC)
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Lets you run the script manually via GitHub web ui

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database via API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/realm_stats?select=timestamp&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          echo "Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Ping failed with status $HTTP_STATUS"
            exit 1
          fi
